name: Release

# Push a tag like v0.1.0 to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Signing is optional. With these repository secrets set, the APK and AAB are signed with your key:
#   VIRGA_KEYSTORE_BASE64     base64 of the .jks / .keystore file
#   VIRGA_KEYSTORE_PASSWORD
#   VIRGA_KEY_ALIAS
#   VIRGA_KEY_PASSWORD
# Without them the release is published as a pre-release with an unsigned APK, which cannot be installed
# as an update and cannot go to Play.
#
# With PLAY_SERVICE_ACCOUNT_JSON also set, the signed AAB is uploaded to the Play internal testing track.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.VIRGA_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VIRGA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/virga-release.jks"
          echo "VIRGA_KEYSTORE_FILE=$RUNNER_TEMP/virga-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and bundle
        env:
          VIRGA_KEYSTORE_PASSWORD: ${{ secrets.VIRGA_KEYSTORE_PASSWORD }}
          VIRGA_KEY_ALIAS: ${{ secrets.VIRGA_KEY_ALIAS }}
          VIRGA_KEY_PASSWORD: ${{ secrets.VIRGA_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          ./gradlew assembleRelease bundleRelease --stacktrace
          "-PvirgaVersionName=$VERSION_NAME"
          "-PvirgaVersionCode=$VERSION_CODE"

      - name: Collect artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          suffix=""
          if [ "$HAS_KEYSTORE" != "true" ]; then suffix="-unsigned"; fi
          cp app/build/outputs/apk/release/*.apk "dist/virga-${VERSION_NAME}${suffix}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/virga-${VERSION_NAME}${suffix}.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/virga-release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Virga ${{ steps.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ env.HAS_KEYSTORE != 'true' || contains(github.ref_name, '-') }}

      - name: Upload to Play internal testing
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tomasps.virga
          releaseFiles: dist/*.aab
          track: internal
          status: draft
          mappingFile: app/build/outputs/mapping/release/mapping.txt

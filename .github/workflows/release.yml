name: Release

# Builds, verifies and publishes one release from a tag. Three ways in:
#   1. Push a tag:        git tag -a v1.2.0-beta.1 -m "Virga 1.2.0 beta 1" && git push origin v1.2.0-beta.1
#   2. Prepare release:   the "Prepare release" workflow picks the next version, tags main and calls this workflow
#   3. Run workflow:      re-run this workflow by hand for an existing tag (for example after a failed upload)
#
# Tags: vMAJOR.MINOR.PATCH is a stable release; -alpha.N, -beta.N and -rc.N are pre-releases.
# See .github/scripts/release-version.sh for the versionCode scheme and docs/releasing.md for the whole process.
#
# Repository secrets:
#   VIRGA_KEYSTORE_BASE64, VIRGA_KEYSTORE_PASSWORD, VIRGA_KEY_ALIAS, VIRGA_KEY_PASSWORD
#       Upload key. Required for stable releases. Pre-releases without it are published unsigned and marked as such.
#   PLAY_SERVICE_ACCOUNT_JSON   (optional)
#       Uploads the signed bundle to Google Play: pre-releases to internal testing, stable releases to production
#       as a draft that you roll out from the Play Console.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v1.2.0-rc.1
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous: ${{ steps.previous.outputs.tag }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Parse version
        id: version
        run: .github/scripts/release-version.sh parse "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Find the previous release
        id: previous
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          # The release notes compare with the latest older release: any older tag for a pre-release,
          # the latest older stable tag for a stable release.
          previous=""
          best=0
          for t in $(git tag --list 'v*'); do
            parsed=$(.github/scripts/release-version.sh parse "$t" 2>/dev/null) || continue
            code=$(sed -n 's/^code=//p' <<<"$parsed")
            pre=$(sed -n 's/^prerelease=//p' <<<"$parsed")
            if (( code < CODE && code > best )) && { [ "$PRERELEASE" = true ] || [ "$pre" = false ]; }; then
              best=$code
              previous=$t
            fi
          done
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${previous:-none}"

      - name: Stable releases come from main
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error::Stable release $TAG must point at a commit on main."
            exit 1
          fi

      - name: Signing
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.VIRGA_KEYSTORE_BASE64 != '' && secrets.VIRGA_KEYSTORE_PASSWORD != '' && secrets.VIRGA_KEY_ALIAS != '' && secrets.VIRGA_KEY_PASSWORD != '' }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          echo "signed=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEYSTORE" != true ]; then
            if [ "$PRERELEASE" = false ]; then
              echo "::error::Stable releases must be signed. Set the VIRGA_KEYSTORE_* repository secrets (see docs/releasing.md)."
              exit 1
            fi
            echo "::warning::No signing key: this pre-release is published unsigned. Unsigned APKs cannot be installed."
          fi

  verify:
    name: Tests and lint
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Unit and UI flow tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-verify-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  build:
    name: Build release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.name }}
      VERSION_CODE: ${{ needs.prepare.outputs.code }}
      SIGNED: ${{ needs.prepare.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Decode keystore
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VIRGA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/virga-release.jks"
          echo "VIRGA_KEYSTORE_FILE=$RUNNER_TEMP/virga-release.jks" >> "$GITHUB_ENV"

      - name: Build APK and bundle
        env:
          VIRGA_KEYSTORE_PASSWORD: ${{ secrets.VIRGA_KEYSTORE_PASSWORD }}
          VIRGA_KEY_ALIAS: ${{ secrets.VIRGA_KEY_ALIAS }}
          VIRGA_KEY_PASSWORD: ${{ secrets.VIRGA_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease --stacktrace
          "-PvirgaVersionName=$VERSION_NAME"
          "-PvirgaVersionCode=$VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/virga-release.jks"

      - name: Check the built version
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          for apk in app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk; do
            badging=$("$aapt2" dump badging "$apk" | head -n 1)
            echo "$apk: $badging"
            grep -q "versionCode='$VERSION_CODE'" <<<"$badging" || { echo "::error::$apk versionCode is not $VERSION_CODE"; exit 1; }
            grep -q "versionName='$VERSION_NAME'" <<<"$badging" || { echo "::error::$apk versionName is not $VERSION_NAME"; exit 1; }
          done

      - name: Verify signature
        id: certificate
        if: env.SIGNED == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          digest_of() {
            "$apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          "$apksigner" verify --verbose app/build/outputs/apk/release/*.apk
          "$apksigner" verify --verbose wear/build/outputs/apk/release/*.apk
          digest=$(digest_of app/build/outputs/apk/release/*.apk)
          wear_digest=$(digest_of wear/build/outputs/apk/release/*.apk)
          [ -n "$digest" ] || { echo "::error::Could not read the signing certificate"; exit 1; }
          # The Wear Data Layer only delivers items between apps with the same package name and signing key.
          [ "$digest" = "$wear_digest" ] || { echo "::error::The watch APK is signed with a different key than the phone APK"; exit 1; }
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        env:
          CERT_SHA256: ${{ steps.certificate.outputs.sha256 }}
        run: |
          mkdir dist
          suffix=""
          [ "$SIGNED" = true ] || suffix="-unsigned"
          cp app/build/outputs/apk/release/*.apk "dist/virga-${VERSION_NAME}${suffix}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/virga-${VERSION_NAME}${suffix}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/virga-${VERSION_NAME}-mapping.txt"
          # The watch app is published as an APK only. It is not uploaded to Google Play yet.
          cp wear/build/outputs/apk/release/*.apk "dist/virga-wear-${VERSION_NAME}${suffix}.apk"
          cp wear/build/outputs/mapping/release/mapping.txt "dist/virga-wear-${VERSION_NAME}-mapping.txt"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          printf '%s' "$CERT_SHA256" > dist/.certificate-sha256
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.name }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.name }}
      VERSION_CODE: ${{ needs.prepare.outputs.code }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      SIGNED: ${{ needs.prepare.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.name }}
          path: dist

      - name: Write release notes
        run: |
          cert=$(cat dist/.certificate-sha256 2>/dev/null || true)
          rm -f dist/.certificate-sha256
          args=(-f "tag_name=$RELEASE_TAG")
          [ -n "$PREVIOUS" ] && args+=(-f "previous_tag_name=$PREVIOUS")
          changes=$(gh api "repos/$GH_REPO/releases/generate-notes" "${args[@]}" --jq .body)

          {
            if [ "$PRERELEASE" = true ]; then
              echo "> [!WARNING]"
              echo "> **Pre-release ($CHANNEL).** For testing. Expect rough edges, and back up nothing you cannot lose."
              echo
            fi
            if [ "$SIGNED" != true ]; then
              echo "> [!CAUTION]"
              echo "> This build is **unsigned** and cannot be installed as is. It exists to check the build, not to use."
              echo
            fi
            phone_apk=$(cd dist && ls virga-*.apk | grep -v '^virga-wear-')
            wear_apk=$(cd dist && ls virga-wear-*.apk)
            echo "## Install"
            echo
            echo "**Phone.** Download \`$phone_apk\` below and open it on an Android 9 or newer device."
            echo "Updates install over an earlier Virga release signed with the same key."
            echo
            echo "**Watch (optional, Wear OS 4 or newer).** Install the phone app first, then \`$wear_apk\` on the paired watch with"
            echo "adb over Wi-Fi: turn on Developer options, ADB debugging and Wireless debugging on the watch, then run"
            echo "\`adb pair <ip>:<pairing-port>\`, \`adb connect <ip>:<port>\` and"
            echo "\`adb -s <ip>:<port> install $wear_apk\`. Sign in (or explore the demo) on the phone and the watch connects."
            echo "The watch app is new and has not run on a physical watch yet: bug reports are welcome."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | $VERSION_NAME (code $VERSION_CODE) |"
            echo "| Channel | $CHANNEL |"
            [ -n "$cert" ] && echo "| Signing certificate SHA-256 | \`$cert\` |"
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt\`. The mapping file is for reading crash traces."
            echo
            echo "$changes"
          } > notes.md
          cat notes.md

      - name: Create or update the release
        run: |
          title="Virga $VERSION_NAME"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # A re-run replaces the assets and notes of the existing release instead of failing.
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file notes.md "${flags[@]}"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
          fi

      - name: Summary
        run: |
          {
            echo "### Virga $VERSION_NAME published"
            echo "- Channel: $CHANNEL (versionCode $VERSION_CODE), signed: $SIGNED"
            echo "- Compared with: ${PREVIOUS:-first release}"
            echo "- $(gh release view "$RELEASE_TAG" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"

  play:
    name: Upload to Google Play
    needs: [prepare, publish]
    if: needs.prepare.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Skip without Play credentials
        if: env.HAS_PLAY != 'true'
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set; the release is on GitHub only."

      - uses: actions/download-artifact@v8
        if: env.HAS_PLAY == 'true'
        with:
          name: release-${{ needs.prepare.outputs.name }}
          path: dist

      - uses: r0adkll/upload-google-play@v1
        if: env.HAS_PLAY == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tomasps.virga
          releaseFiles: dist/virga-${{ needs.prepare.outputs.name }}.aab
          mappingFile: dist/virga-${{ needs.prepare.outputs.name }}-mapping.txt
          releaseName: ${{ needs.prepare.outputs.name }}
          # Pre-releases go straight to internal testers. Stable releases land in production as a draft, so a person
          # starts the rollout from the Play Console.
          track: ${{ needs.prepare.outputs.prerelease == 'true' && 'internal' || 'production' }}
          status: ${{ needs.prepare.outputs.prerelease == 'true' && 'completed' || 'draft' }}
